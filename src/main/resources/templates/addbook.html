<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Server Programming with Spring Boot</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link
      type="text/css"
      rel="stylesheet"
      href="/css/bootstrap.min.css"
      th:href="@{/css/bootstrap.min.css}"
    />
  </head>
  <body>
    <h1>Add Book</h1>
    <div>
      <form th:object="${book}" th:action="@{save}" action="#" method="post">
        <div>
          <label for="title">Title</label>
          <input type="text" id="title" th:field="*{title}" required />
        </div>

        <div>
          <label for="author">Author</label>
          <input type="text" id="author" th:field="*{author}" required />
        </div>

        <div>
          <label for="year">Publication Year</label>
          <input type="number" id="year" th:field="*{publicationYear}" />
        </div>

        <div>
          <label for="isbn">ISBN</label>
          <input type="text" id="isbn" th:field="*{isbn}" />
        </div>

        <div>
          <label for="price">Price</label>
          <input type="number" step="0.01" id="price" th:field="*{price}" />
        </div>

        <div>
          <label for="category">Category</label>
          <select id="category" th:field="*{category}" required>
            <option value="">Select a category</option>
            <option
              th:each="category : ${categories}"
              th:value="${category.id}"
              th:text="${category.name}"
            ></option>
          </select>
        </div>

        <div style="margin-top: 10px">
          <input type="submit" value="Save" />
        </div>
      </form>
    </div>
  </body>
</html>
