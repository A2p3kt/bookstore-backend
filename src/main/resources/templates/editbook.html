<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Edit Book</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    </head>
    <body>
        <h1>Edit Book</h1>
        <div>
            <form th:object="${book}" th:action="@{/save}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div>
                    <label for="title">Title</label>
                    <input type="text" id="title" th:field="*{title}" required />
                </div>

                <div>
                    <label for="author">Author</label>
                    <input type="text" id="author" th:field="*{author}" required />
                </div>

                <div>
                    <label for="year">Publication Year</label>
                    <input type="number" id="year" th:field="*{publicationYear}" />
                </div>

                <div>
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" th:field="*{isbn}" />
                </div>

                <div>
                    <label for="price">Price</label>
                    <input type="number" step="0.01" id="price" th:field="*{price}" />
                </div>

                <div style="margin-top: 10px;">
                    <input type="submit" value="Save Changes" />
                </div>
            </form>
        </div>
    </body>
</html>
